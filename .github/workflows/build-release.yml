name: Release Build Matrix

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  APP_VERSION: v1.8.1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-22.04
          - target: windows
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- Android ----------------
      - name: Set up Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter 3.16.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android default debug keystore
        if: matrix.target == 'android'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APKs (all ABIs)
        if: matrix.target == 'android'
        env:
          KEYSTORE: debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: flutter build apk --release --split-per-abi

      - name: Upload app-arm64-v8a-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload app-armeabi-v7a-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload app-x86_64-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release.apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      # ---------------- Windows ----------------
      - name: Build Windows release
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Bundle up-to-date MSVC runtime DLLs
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          # 官方 v1.8.1 包内捆绑的是 2022 年的旧 MSVC 运行库 (MSVCP140 14.30)，
          # 而 runner 的新编译器 (14.44) 生成的代码需要新版运行库，否则启动即崩
          # (0xC0000005 in MSVCP140.dll)。这里用 VS 自带的 Redist 目录中的新版覆盖。
          $dest = "build\windows\x64\runner\Release"
          # Redist 目录下既有 v143 这类符号目录，也有 14.xx.xxxxx 版本目录，
          # 直接按 msvcp140.dll 的实际 FileVersion 挑最新的 x64 CRT。
          $root = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          # 只取桌面版 CRT（排除 onecore/uwp 变体，那些适用于 UWP/系统组件）
          $best = Get-ChildItem $root -Recurse -File -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.DirectoryName -match '\\x64\\Microsoft\.VC143\.CRT$' -and
                    $_.DirectoryName -notmatch 'onecore|uwp|store'
                  } |
                  Sort-Object { [version]($_.VersionInfo.FileVersion -replace '\s.*$','') } -Descending |
                  Select-Object -First 1
          if (-not $best) { throw "Microsoft.VC143.CRT (x64) not found under $root" }
          $src = $best.DirectoryName
          Write-Host "Using CRT dir: $src"
          Write-Host "=== runtime versions in Redist ==="
          Get-ChildItem $src -Filter *.dll | ForEach-Object {
            "{0} => {1}" -f $_.Name, $_.VersionInfo.FileVersion
          }
          Copy-Item "$src\*.dll" -Destination $dest -Force
          Write-Host "=== runtime versions in package after copy ==="
          foreach ($f in @("msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","vcruntime140.dll","vcruntime140_1.dll","concrt140.dll")) {
            $p = Join-Path $dest $f
            if (Test-Path $p) { "{0} => {1}" -f $f, (Get-Item $p).VersionInfo.FileVersion }
            else { "{0} => MISSING" -f $f }
          }

      - name: Build Inno Setup installer
        if: matrix.target == 'windows'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=${{ env.APP_VERSION }}" ".\inno_setup.iss"

      - name: Archive Windows portable zip
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          # 注意：Compress-Archive 用通配符会把目录本身包进去，导致解压多一层目录。
          # 这里显式列出条目，保证解压后文件直接在根目录。
          $src = "build\windows\x64\runner\Release"
          $items = Get-ChildItem -Path $src -Force | Select-Object -ExpandProperty FullName
          Compress-Archive -Path $items -DestinationPath "Miru-${{ env.APP_VERSION }}-windows.zip" -Force
          Write-Host "=== zip content (top level) ==="
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "Miru-${{ env.APP_VERSION }}-windows.zip"))
          $zip.Entries | ForEach-Object { $_.FullName } | Where-Object { $_ -notmatch "/" } | Select-Object -First 20
          $zip.Dispose()
          Get-ChildItem -Recurse -File .\Output, .\Miru-*-windows.zip | Select-Object FullName, Length

      - name: Upload Miru-${{ env.APP_VERSION }}-windows (unpacked)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Miru-${{ env.APP_VERSION }}-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload miru-setup-${{ env.APP_VERSION }}.exe
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: miru-setup-${{ env.APP_VERSION }}.exe
          path: Output/miru-setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error

      - name: Upload Miru-${{ env.APP_VERSION }}-windows.zip
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Miru-${{ env.APP_VERSION }}-windows.zip
          path: Miru-${{ env.APP_VERSION }}-windows.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Assemble release files
        shell: bash
        run: |
          mkdir -p release_files
          # upload-artifact 对单文件是原样保存；对目录才打包成 zip。
          # 所以 APK / exe 直接拷贝，windows 目录包跳过（已单独提供 zip）。
          for a in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk "miru-setup-${{ env.APP_VERSION }}.exe"; do
            cp "artifacts/$a/$a" release_files/
          done
          cp "artifacts/Miru-${{ env.APP_VERSION }}-windows.zip/Miru-${{ env.APP_VERSION }}-windows.zip" release_files/
          ls -l release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Miru ${{ env.APP_VERSION }} (custom build)
          body: |
            Custom build from fork `ilylty/miru-app` (branch dev).

            - Webtoon 条漫相邻图片接缝修复
            - Android: 默认调试签名（与官方签名不同，安装前需卸载官方版）
            - Windows: 捆绑最新 MSVC 运行库，修复启动闪退 (0xC0000005)
          draft: true
          files: release_files/*
          fail_on_unmatched_files: true
