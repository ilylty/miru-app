name: Release Build Matrix

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  APP_VERSION: v1.8.1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-22.04
          - target: windows
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- Android ----------------
      - name: Set up Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter 3.16.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android default debug keystore
        if: matrix.target == 'android'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APKs (all ABIs)
        if: matrix.target == 'android'
        env:
          KEYSTORE: debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: flutter build apk --release --split-per-abi

      - name: List APK outputs
        if: matrix.target == 'android'
        run: ls -l build/app/outputs/flutter-apk/

      - name: Upload app-arm64-v8a-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload app-armeabi-v7a-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload app-x86_64-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release.apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      # ---------------- Windows ----------------
      - name: Diagnose Visual Studio
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products "*" -format json
          flutter doctor -v

      - name: Build Windows release
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Build Inno Setup installer
        if: matrix.target == 'windows'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=${{ env.APP_VERSION }}" ".\inno_setup.iss"

      - name: Archive Windows portable zip
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ".\build\windows\x64\runner\Release\*" -DestinationPath "Miru-${{ env.APP_VERSION }}-windows.zip" -Force
          Get-ChildItem -Recurse -File .\Output, .\Miru-*-windows.zip | Select-Object FullName, Length

      - name: Upload miru-setup-${{ env.APP_VERSION }}.exe
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: miru-setup-${{ env.APP_VERSION }}.exe
          path: Output/miru-setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error

      - name: Upload Miru-${{ env.APP_VERSION }}-windows.zip
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Miru-${{ env.APP_VERSION }}-windows.zip
          path: Miru-${{ env.APP_VERSION }}-windows.zip
          if-no-files-found: error
