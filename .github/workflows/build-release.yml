name: Release Build Matrix

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  APP_VERSION: v1.8.1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-22.04
          - target: windows
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- Android ----------------
      - name: Set up Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter 3.16.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android default debug keystore
        if: matrix.target == 'android'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APKs (all ABIs)
        if: matrix.target == 'android'
        env:
          KEYSTORE: debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: flutter build apk --release --split-per-abi

      - name: Upload app-arm64-v8a-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload app-armeabi-v7a-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload app-x86_64-release.apk
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release.apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      # ---------------- Windows ----------------
      - name: Install MSVC 14.37 toolset (match official v1.8.1 build)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          # 官方 v1.8.1 用 MSVC 14.37 (VS 2022 17.7) 构建；
          # runner 只有最新 14.44，需加装 14.37 工具集并固定使用
          $setup = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $args = @(
            "modify",
            "--installPath", $installPath,
            "--add", "Microsoft.VisualStudio.Component.VC.14.37.17.7.x86.x64",
            "--quiet", "--norestart"
          )
          $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            Write-Error "setup.exe modify failed with exit code $($p.ExitCode)"
            exit $p.ExitCode
          }
          Get-ChildItem "$installPath\VC\Tools\MSVC" | Select-Object -ExpandProperty Name

      - name: Build Windows release (MSVC 14.37)
        if: matrix.target == 'windows'
        env:
          CMAKE_GENERATOR_TOOLSET: v143,version=14.37
        run: flutter build windows --release

      - name: Build Inno Setup installer
        if: matrix.target == 'windows'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=${{ env.APP_VERSION }}" ".\inno_setup.iss"

      - name: Archive Windows portable zip
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ".\build\windows\x64\runner\Release\*" -DestinationPath "Miru-${{ env.APP_VERSION }}-windows.zip" -Force
          Get-ChildItem -Recurse -File .\Output, .\Miru-*-windows.zip | Select-Object FullName, Length

      - name: Upload Release directory (no nested zip)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Miru-${{ env.APP_VERSION }}-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload miru-setup-${{ env.APP_VERSION }}.exe
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: miru-setup-${{ env.APP_VERSION }}.exe
          path: Output/miru-setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error

      - name: Upload Miru-${{ env.APP_VERSION }}-windows.zip
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Miru-${{ env.APP_VERSION }}-windows.zip
          path: Miru-${{ env.APP_VERSION }}-windows.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Assemble release files
        shell: bash
        run: |
          mkdir -p release_files
          # Android APKs（artifact 是单文件，解包一次拿到 apk）
          for a in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk; do
            unzip -o -q "artifacts/$a/$a" -d release_files
          done
          # Windows exe
          unzip -o -q "artifacts/miru-setup-${{ env.APP_VERSION }}.exe/miru-setup-${{ env.APP_VERSION }}.exe" -d release_files
          # Windows zip（artifact 是 zip 包，里面就是目标 zip，直接取出）
          unzip -o -q "artifacts/Miru-${{ env.APP_VERSION }}-windows.zip/Miru-${{ env.APP_VERSION }}-windows.zip" -d release_files
          ls -l release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Miru ${{ env.APP_VERSION }} (custom build)
          body: |
            Custom build from fork `ilylty/miru-app` (branch dev).

            - Webtoon 条漫相邻图片接缝修复
            - Android: 默认调试签名（需卸载官方版后安装）
            - Windows: MSVC 14.37 工具链，与官方 v1.8.1 一致
          draft: true
          files: release_files/*
          fail_on_unmatched_files: true
