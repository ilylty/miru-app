name: Build arm64-v8a Release APK

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KEYSTORE: keystore.jks
      KEYSTORE_PASSWORD: miruci123
      KEY_ALIAS: miru-ci
      KEY_PASSWORD: miruci123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter 3.16.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate temporary signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias miru-ci \
            -storepass miruci123 -keypass miruci123 \
            -dname "CN=miru-ci, OU=ci, O=ci, L=ci, S=ci, C=CN"

      - name: Build arm64-v8a release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Verify artifact
        run: ls -l build/app/outputs/flutter-apk/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
