name: Build arm64-v8a Release APK

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter 3.16.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64-v8a release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: List build outputs
        run: ls -l build/app/outputs/flutter-apk/

      - name: Normalize APK name
        run: |
          cd build/app/outputs/flutter-apk
          if [ -f app-arm64-v8a-release-unsigned.apk ]; then
            mv app-arm64-v8a-release-unsigned.apk app-arm64-v8a-release.apk
          fi
          ls -l

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
